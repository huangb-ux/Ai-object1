# 一步起完整服务：应用 + Caddy（自动签发 HTTPS）
# 用法：
#   DOMAIN=你的域名 或 1.2.3.4.sslip.io   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 想用大模型解析就填，不填则走本地规则引擎
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - ZHANGDENG_DB=/data/zhangdeng.db
    volumes:
      - ./data:/data
    expose:
      - "3100"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
